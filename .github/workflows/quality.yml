name: Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.2
          cache: npm
      - run: npm ci
      - run: node scripts/release-readiness/audit-checks.mjs validate
      - run: node scripts/release-readiness/audit-checks.mjs lint
      - run: node scripts/release-readiness/audit-checks.mjs unit
      - run: node scripts/release-readiness/audit-checks.mjs client
      - run: node scripts/release-readiness/audit-checks.mjs typecheck
      - run: node scripts/release-readiness/audit-checks.mjs tsc
      - run: node scripts/release-readiness/audit-checks.mjs build
      - run: npm audit --omit=dev --audit-level=high
      - name: Scope of this check
        if: always()
        run: echo 'Quality checks do not certify live delivery, external AI or isolated integration suites. See docs/audit/RELEASE_READINESS.md.' >> "$GITHUB_STEP_SUMMARY"
  ai-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LUMACLEAN_LOCAL_PG18: 'true'
      LUMACLEAN_SYNTHETIC_READINESS: 'true'
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          PGDATA: /lumaclean-test/pgdata18
        ports:
          - '127.0.0.1:55449:5432'
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.2
          cache: npm
      - run: npm ci
      - run: node scripts/release-readiness/audit-ai-suite.mjs
      - name: Evidence boundary
        if: always()
        run: echo 'ISOLATED PostgreSQL 18 and MOCKED providers. Synthetic readiness fixture is not production certification or native/live proof. AI AUTO release still requires independent gates.' >> "$GITHUB_STEP_SUMMARY"
